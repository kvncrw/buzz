name: pagoda desktop linux

# Fork build of Buzz Desktop for Linux (x86_64 AppImage + .deb) from the
# `pagoda` integration branch. Mirrors the `release-linux` job in upstream
# release.yml (same container, deps, pinned appimagetool/runtime, sidecars,
# fix-appimage.sh), signed with the fork's updater key and pointed at the
# fork's updater endpoint. Publishes GitHub release desktop-v<version> with
# the AppImage, its .sig, the .deb and latest.json, so
# https://github.com/kvncrw/buzz/releases/latest/download/latest.json keeps
# installed fork builds current through the in-app updater.
#
# Version: <desktop/src-tauri/tauri.conf.json version>-pagoda.<run_number>,
# a semver prerelease that is monotonic per workflow and always sorts below
# the matching stock release, so the stock updater never offers fork builds
# and vice versa.

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit or branch to build (default: the triggering sha)"
        type: string
        required: false
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or branch to build (default: the triggering sha)"
        type: string
        required: false
  push:
    branches: [pagoda]
    paths-ignore:
      - ".pagoda/**"
      - ".github/workflows/pagoda-relay-image.yml"
      - ".github/workflows/pagoda-sync.yml"
      - "**.md"

concurrency:
  group: pagoda-desktop-linux-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json

jobs:
  build:
    name: Build and release Linux
    runs-on: ubuntu-latest
    container: ubuntu:24.04@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      # AppImage tools are themselves AppImages; containers lack FUSE so we
      # must use the extract-and-run fallback.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30
          apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=120 \
            build-essential \
            ca-certificates \
            curl \
            desktop-file-utils \
            file \
            git \
            jq \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            squashfs-tools \
            wget \
            xdg-utils
          mkdir -p -m 755 /etc/apt/keyrings
          wget -q --tries=3 --timeout=30 -O /usr/share/keyrings/githubcli-archive-keyring.gpg \
            https://cli.github.com/packages/githubcli-archive-keyring.gpg
          echo "6084d5d7bd8e288441e0e94fc6275570895da18e6751f70f057485dc2d1a811b  /usr/share/keyrings/githubcli-archive-keyring.gpg" | sha256sum -c
          chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            > /etc/apt/sources.list.d/github-cli.list
          apt-get update
          apt-get install -y --no-install-recommends gh

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Mark workspace safe for git (containerized job)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The sync workflow pushes pagoda and then calls this workflow, so
      # github.sha can be stale; take the sha from the checkout instead.
      - name: Resolve source sha
        id: src
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Determine version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          BASE=$(jq -r .version desktop/src-tauri/tauri.conf.json)
          VERSION="${BASE}-pagoda.${RUN_NUMBER}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid version '$VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: |
            . -> target
            desktop/src-tauri -> target
          # Only the integration branch writes the cache.
          save-if: ${{ github.ref == 'refs/heads/pagoda' }}

      - name: Install appimagetool
        run: |
          # Pinned release tag 1.9.1 and type2-runtime 20251108, same as
          # upstream release.yml; refuse to run unverified binaries.
          case "$(uname -m)" in
            x86_64)  ARCH_SUFFIX="x86_64" ;;
            *)
              echo "::error::Unsupported architecture: $(uname -m)"
              exit 1
              ;;
          esac
          wget -q --tries=3 --timeout=30 -O /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${ARCH_SUFFIX}.AppImage"
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool" | sha256sum -c
          install -m 755 /tmp/appimagetool /usr/local/bin/appimagetool
          wget -q --tries=3 --timeout=30 -O /tmp/appimage-runtime \
            "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-${ARCH_SUFFIX}"
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  /tmp/appimage-runtime" | sha256sum -c
          install -D -m 644 /tmp/appimage-runtime /usr/local/lib/appimage-runtime
          echo "APPIMAGETOOL_RUNTIME_FILE=/usr/local/lib/appimage-runtime" >> "$GITHUB_ENV"

      - name: Install desktop dependencies
        run: just desktop-install-ci

      - name: Patch version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd desktop && node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri && cargo update --workspace

      - name: Build sidecars
        run: |
          cargo build --release -p buzz-acp -p buzz-agent -p buzz-backend-kubernetes -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh

      - name: Generate release config
        run: cd desktop && node scripts/build-release-config.mjs
        env:
          BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: ${{ env.UPDATER_ENDPOINT }}

      - name: Build Linux Tauri app
        run: cd desktop && pnpm tauri build --ci --bundles deb,appimage --features mesh-llm --config src-tauri/tauri.release.conf.json
        env:
          BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: ${{ env.UPDATER_ENDPOINT }}
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Fix AppImage (remove infra libs, shim host GStreamer)
        run: |
          mapfile -t APPIMAGES < <(find desktop/src-tauri/target/release/bundle/appimage -name '*.AppImage' -type f)
          if [[ ${#APPIMAGES[@]} -eq 0 ]]; then
            echo "::error::No AppImage found to post-process"
            exit 1
          fi
          if [[ ${#APPIMAGES[@]} -gt 1 ]]; then
            echo "::error::Expected exactly one AppImage, found ${#APPIMAGES[@]}: ${APPIMAGES[*]}"
            exit 1
          fi
          bash desktop/scripts/fix-appimage.sh "${APPIMAGES[0]}"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Locate Linux build artifacts
        id: linux-artifacts
        run: |
          BUNDLE_DIR="desktop/src-tauri/target/release/bundle"

          DEB=$(find "$BUNDLE_DIR/deb" -name '*.deb' -type f | head -1)
          if [[ -z "$DEB" ]]; then
            echo "::error::No DEB found in $BUNDLE_DIR/deb"
            exit 1
          fi
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"

          APPIMAGE=$(find "$BUNDLE_DIR/appimage" -name '*.AppImage' -type f | head -1)
          if [[ -z "$APPIMAGE" ]]; then
            echo "::error::No AppImage found in $BUNDLE_DIR/appimage"
            exit 1
          fi
          echo "appimage=$APPIMAGE" >> "$GITHUB_OUTPUT"

          # Tauri 2.11+ signs the AppImage directly (*.AppImage + *.AppImage.sig);
          # earlier versions wrapped it in a tar.gz. Try the new format first.
          ARCHIVE=$(find "$BUNDLE_DIR/appimage" -name '*.AppImage.tar.gz' ! -name '*.sig' -type f | head -1)
          if [[ -n "$ARCHIVE" ]]; then
            SIG="${ARCHIVE}.sig"
          else
            ARCHIVE="$APPIMAGE"
            SIG="${APPIMAGE}.sig"
          fi
          if [[ -z "$ARCHIVE" || ! -f "$SIG" ]]; then
            echo "::error::AppImage updater archive or signature not found in $BUNDLE_DIR/appimage"
            exit 1
          fi
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "archive_name=$(basename "$ARCHIVE")" >> "$GITHUB_OUTPUT"
          echo "sig=$SIG" >> "$GITHUB_OUTPUT"

      - name: Generate latest.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCHIVE_NAME: ${{ steps.linux-artifacts.outputs.archive_name }}
          SIG_PATH: ${{ steps.linux-artifacts.outputs.sig }}
        run: |
          set -euo pipefail
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/desktop-v${VERSION}"
          bash desktop/scripts/generate-oss-latest-json.sh "$VERSION" \
            "linux-x86_64:${SIG_PATH}:${BASE}/${ARCHIVE_NAME}" > latest.json
          cat latest.json

      - name: Write release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_SHA: ${{ steps.src.outputs.sha }}
        run: |
          set -euo pipefail
          # The upstream commit this build contains = merge-base with block/buzz main.
          UPSTREAM_SHA=unknown
          if git fetch --no-tags --quiet https://github.com/block/buzz.git main; then
            UPSTREAM_SHA=$(git merge-base FETCH_HEAD HEAD || echo unknown)
          fi
          {
            echo "Buzz Desktop ${VERSION} (Linux x86_64), built from \`${SOURCE_SHA}\` on branch \`${GITHUB_REF_NAME}\`."
            echo
            echo "Upstream block/buzz main: \`${UPSTREAM_SHA}\`"
            echo
            echo "Patches (.pagoda/patches.txt):"
            echo '```'
            grep -vE '^\s*(#|$)' .pagoda/patches.txt
            echo '```'
            echo
            echo "Updater endpoint: ${UPDATER_ENDPOINT}"
            echo
            echo "## Install / upgrade"
            echo
            echo "Already running a pagoda build: the in-app updater offers this one (relaunch Buzz if it does not)."
            echo "Running stock Buzz: install once, after that the updater follows this fork."
            echo
            echo '```bash'
            echo "mkdir -p ~/Applications && cd ~/Applications"
            echo "curl -fLo Buzz.AppImage https://github.com/${GITHUB_REPOSITORY}/releases/download/desktop-v${VERSION}/Buzz_${VERSION}_amd64.AppImage"
            echo "chmod +x Buzz.AppImage && ./Buzz.AppImage"
            echo '```'
            echo
            echo "Debian/Ubuntu: \`sudo dpkg -i Buzz_${VERSION}_amd64.deb\` from the assets below. The relay image is \`ghcr.io/${GITHUB_REPOSITORY}:pagoda\`."
            echo
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_SHA: ${{ steps.src.outputs.sha }}
          DEB: ${{ steps.linux-artifacts.outputs.deb }}
          APPIMAGE: ${{ steps.linux-artifacts.outputs.appimage }}
          ARCHIVE: ${{ steps.linux-artifacts.outputs.archive }}
          SIG: ${{ steps.linux-artifacts.outputs.sig }}
        run: |
          set -euo pipefail
          TAG="desktop-v${VERSION}"
          files=("$DEB" "$APPIMAGE" "$SIG" latest.json)
          if [[ "$ARCHIVE" != "$APPIMAGE" ]]; then files+=("$ARCHIVE"); fi
          # Not --prerelease and not --draft on purpose: releases/latest must
          # resolve to this release for the updater endpoint to work.
          gh release create "$TAG" \
            --target "$SOURCE_SHA" \
            --title "Buzz Desktop ${VERSION} (pagoda, Linux)" \
            --notes-file release-notes.md \
            --latest \
            "${files[@]}"
          echo "release=https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
