name: pagoda desktop linux

# Build-only lane. The coordinator supplies the same immutable source and
# version to both platforms and is the sole release publisher.

on:
  workflow_call:
    inputs:
      source_sha:
        description: "Immutable commit selected by the coordinator"
        type: string
        required: true
      version:
        description: "Shared X.Y.Z-pagoda.RUN_ID version"
        type: string
        required: true

permissions: {}

env:
  UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
  SOURCE_SHA: ${{ inputs.source_sha }}
  VERSION: ${{ inputs.version }}

jobs:
  build:
    name: Build Linux
    runs-on: ubuntu-latest
    container: ubuntu:24.04@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      # AppImage tools are themselves AppImages; containers lack FUSE so we
      # must use the extract-and-run fallback.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30
          apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=120 \
            build-essential \
            ca-certificates \
            curl \
            desktop-file-utils \
            file \
            git \
            jq \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            python3 \
            squashfs-tools \
            wget \
            xdg-utils

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Mark workspace safe for git (containerized job)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify immutable source
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Install appimagetool
        run: |
          # Pinned release tag 1.9.1 and type2-runtime 20251108, same as
          # upstream release.yml; refuse to run unverified binaries.
          case "$(uname -m)" in
            x86_64)  ARCH_SUFFIX="x86_64" ;;
            *)
              echo "::error::Unsupported architecture: $(uname -m)"
              exit 1
              ;;
          esac
          mkdir -p .appimage-tools
          wget -q --tries=3 --timeout=30 -O .appimage-tools/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${ARCH_SUFFIX}.AppImage"
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  .appimage-tools/appimagetool" | sha256sum -c
          install -m 755 .appimage-tools/appimagetool /usr/local/bin/appimagetool
          wget -q --tries=3 --timeout=30 -O .appimage-tools/appimage-runtime \
            "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-${ARCH_SUFFIX}"
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  .appimage-tools/appimage-runtime" | sha256sum -c
          install -D -m 644 .appimage-tools/appimage-runtime /usr/local/lib/appimage-runtime
          echo "APPIMAGETOOL_RUNTIME_FILE=/usr/local/lib/appimage-runtime" >> "$GITHUB_ENV"

      - name: Install desktop dependencies
        run: just desktop-install-ci

      - name: Patch version
        run: |
          cd desktop && node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri && cargo update --workspace

      - name: Build sidecars
        run: |
          cargo build --release -p buzz-acp -p buzz-agent -p buzz-backend-kubernetes -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh

      - name: Generate release config
        run: cd desktop && node scripts/build-release-config.mjs
        env:
          BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: ${{ env.UPDATER_ENDPOINT }}

      - name: Build Linux Tauri app
        run: cd desktop && pnpm tauri build --ci --bundles deb,appimage --features mesh-llm --config src-tauri/tauri.release.conf.json
        env:
          BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.BUZZ_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: ${{ env.UPDATER_ENDPOINT }}
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Fix AppImage (remove infra libs, shim host GStreamer)
        run: |
          mapfile -t APPIMAGES < <(find desktop/src-tauri/target/release/bundle/appimage -name '*.AppImage' -type f)
          if [[ ${#APPIMAGES[@]} -eq 0 ]]; then
            echo "::error::No AppImage found to post-process"
            exit 1
          fi
          if [[ ${#APPIMAGES[@]} -gt 1 ]]; then
            echo "::error::Expected exactly one AppImage, found ${#APPIMAGES[@]}: ${APPIMAGES[*]}"
            exit 1
          fi
          bash desktop/scripts/fix-appimage.sh "${APPIMAGES[0]}"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Record Linux artifacts and provenance
        run: |
          python3 .pagoda/desktop-release.py record \
            --platform linux-x86_64 --sha "$SOURCE_SHA" --version "$VERSION" \
            --bundle desktop/src-tauri/target/release/bundle --output staged/linux-x86_64

      - name: Stage Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pagoda-desktop-linux-${{ github.run_id }}
          path: staged/linux-x86_64/
          if-no-files-found: error
          overwrite: true
