name: pagoda sync

# Keep the fork tracking upstream: fast-forward `main` to block/buzz main,
# merge it plus every patch in .pagoda/patches.txt into `pagoda`, push both.
# The push uses a PAT (PAGODA_PUSH_TOKEN, `repo` + `workflow` scopes):
# GITHUB_TOKEN cannot push commits that touch .github/workflows/, which every
# upstream CI change does. A PAT push also fires `on: push`, so the relay image
# and desktop builds run from their own push triggers instead of workflow_call.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: pagoda-sync
  cancel-in-progress: false

permissions: {}

jobs:
  sync:
    name: Sync pagoda with upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout pagoda
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: pagoda
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name "pagoda-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run sync
        id: sync
        env:
          PAGODA_FORK_REMOTE: origin
        run: bash .pagoda/sync.sh

      - name: Push main and pagoda
        env:
          MAIN_SHA: ${{ steps.sync.outputs.main_sha }}
          PUSH_TOKEN: ${{ secrets.PAGODA_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$PUSH_TOKEN" ]] || { echo "::error::PAGODA_PUSH_TOKEN secret is not set"; exit 1; }
          helper='!f(){ echo username=x-access-token; echo "password=$PUSH_TOKEN"; }; f'
          # Both are fast-forwards by construction; a non-ff push fails loudly.
          git -c credential.helper="$helper" push origin "${MAIN_SHA}:refs/heads/main"
          git -c credential.helper="$helper" push origin pagoda:refs/heads/pagoda
          echo "main=${MAIN_SHA} pagoda=$(git rev-parse HEAD) changed=${{ steps.sync.outputs.changed }}" >> "$GITHUB_STEP_SUMMARY"
